# Local Postgres for AI Flashcards (Project 1). Matches DATABASE_URL in .env.example.
# Start with: docker compose up -d   (then `pnpm db:migrate` to apply migrations)
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-flashcards-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: flashcards
      POSTGRES_DB: flashcards
    ports:
      - '5433:5432'
    volumes:
      - flashcards-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flashcards -d flashcards']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flashcards-pgdata:
