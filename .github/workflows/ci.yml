name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_UI: 'false'

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo lint --filter=...[HEAD^1]
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck --filter=...[HEAD^1]

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres for the ai-flashcards api integration tests (CI-001). Other workspaces
    # ignore it; only the api reads DATABASE_URL. Turbo's --filter still scopes which
    # tests actually run, so unaffected PRs simply never touch the database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flashcards
          POSTGRES_PASSWORD: flashcards
          POSTGRES_DB: flashcards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashcards -d flashcards_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://flashcards:flashcards@localhost:5432/flashcards_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply ai-flashcards api migrations
        run: pnpm --filter @product-engineer/1-ai-flashcards-api exec prisma migrate deploy
      - run: pnpm turbo test --filter=...[HEAD^1]

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-format, type-check, unit-tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint-format.result }}" != "success" || \
                "${{ needs.type-check.result }}" != "success" || \
                "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "One or more checks failed:"
            echo "  lint-format: ${{ needs.lint-format.result }}"
            echo "  type-check:  ${{ needs.type-check.result }}"
            echo "  unit-tests:  ${{ needs.unit-tests.result }}"
            exit 1
          fi
          echo "All checks passed"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      # The image preinstalls browsers at /ms-playwright; the job HOME is /github/home,
      # so point Playwright at the image path instead of the empty ~/.cache/ms-playwright.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 30
    needs: [ci-gate]
    if: >
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
      && needs.ci-gate.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
